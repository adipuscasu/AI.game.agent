[project]
name = "ai-game-agent"
version = "0.1.0"
description = "Local, AI-driven computer-use agent for graphical games (initial target: World of Warcraft)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adrian Puscasu" }]
keywords = ["computer-use", "agent", "screen-capture", "vision", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Phase 1 capture backend + image persistence. Not required for the test suite
# (a mock backend and injected fakes are used), but needed for real capture and
# PNG frame saving. Pillow backs Frame.to_pil() and save_frame().
capture = [
    "mss>=9.0",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "freezegun>=1.4",
    "ruff>=0.4",
    "Pillow>=10.0",
]
# Phase 2 perception. ``vision`` backs template matching / blob detection
# (OpenCV + numpy). ``ocr`` wraps the Tesseract binary. Both are optional: the
# core package and its contract tests import and run with neither installed.
vision = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]
ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
ai-game-agent = "ai_game_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_game_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "e2e: end-to-end CLI tests that spawn the real entry point as a subprocess",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
