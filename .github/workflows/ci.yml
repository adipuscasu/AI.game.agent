name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Show tool versions
        run: uv --version && python --version

      - name: Install project + all extras
        # All optional extras (capture / dev / vision / ocr) are installed so
        # the OpenCV + Tesseract code paths are exercised. The bare-env contract
        # is still enforced by tests/test_cli.py, which blocks cv2/numpy in a
        # subprocess via a meta_path importer — independent of what is installed.
        run: uv sync --all-extras

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Test (pytest)
        run: uv run pytest tests/ -q
