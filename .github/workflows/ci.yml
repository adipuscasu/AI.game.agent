name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Install Python 3.11
        # setup-uv's python-version input only sets UV_PYTHON; it does not
        # install the interpreter. Install it explicitly so the find below and
        # uv sync have a guaranteed interpreter on a clean runner.
        run: uv python install 3.11

      - name: Show tool versions
        run: |
          uv --version
          uv python find 3.11

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest
